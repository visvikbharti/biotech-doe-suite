[theme]
primaryColor = "#0466C8" # A nice blue color
backgroundColor = "#FFFFFF" # White background
secondaryBackgroundColor = "#F0F2F6" # Light gray for secondary elements
textColor = "#262730" # Dark text for readability
font = "sans serif" # Clean, modern font

[server]
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 200 # Max upload size in MB

[browser]
gatherUsageStats = false # Disable usage statistics